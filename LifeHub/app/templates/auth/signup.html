<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeHub - Đăng ký</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/LifeHub/app/static/CSS/auth/signup.css">

    <style>

    </style>
</head>

<body>

    <!-- DARK MODE BUTTON -->

    <div class="theme-toggle">
        <button id="lightBtn" type="button">☀️</button>
        <button id="darkBtn" class="active">🌙</button>
    </div>

    <div class="container">

        <!-- LEFT -->

        <div class="left">

            <div class="logo">
                🌿 LifeHub
            </div>

            <h1>
                Bắt đầu hành trình sống tốt hơn.
            </h1>

            <p>
                Quản lý bữa ăn, xây dựng thói quen,
                theo dõi chi tiêu và phát triển bản thân
                trên một nền tảng duy nhất.
            </p>

            <div class="stats">

                <div class="stat">
                    <h2>10K+</h2>
                    <span>Người dùng</span>
                </div>

                <div class="stat">
                    <h2>1M+</h2>
                    <span>Check-in</span>
                </div>

                <div class="stat">
                    <h2>95%</h2>
                    <span>Hài lòng</span>
                </div>

            </div>

        </div>

        <!-- RIGHT -->

        <div class="right">

            <div class="register-card">

                <h2>Tạo tài khoản</h2>

                <div class="subtitle">
                    Chào mừng bạn đến với LifeHub
                </div>

                <form id="signupForm">

                    <div class="row">

                        <div class="form-group">
                            <label>Họ</label>
                            <input id="lastname" type="text" placeholder="Nguyễn">
                        </div>

                        <div class="form-group">
                            <label>Tên</label>
                            <input id="firstname" type="text" placeholder="Văn A">
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input id="email" type="email" placeholder="example@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <input id="username" type="text" placeholder="username">
                    </div>

                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input id="password" type="password" placeholder="********">
                    </div>

                    <div class="form-group">
                        <label>Xác nhận mật khẩu</label>
                        <input id="confirmPassword" type="password" placeholder="********">
                    </div>

                    <button type="submit" class="btn">
                        Tạo tài khoản
                    </button>

                </form>

                <div class="divider">
                    hoặc đăng ký bằng
                </div>

                <div class="social">

                    <button>Google</button>

                    <button>Facebook</button>

                    <button>Apple</button>

                </div>

                <div class="login-link">

                    Đã có tài khoản?

                    <a href="/LifeHub/app/templates/auth/login.html">
                        Đăng nhập
                    </a>

                </div>

            </div>

        </div>

    </div>
    <script defer type="module" src="/LifeHub/app/static/JS/auth/signup.js"></script>
</body>

</html>
